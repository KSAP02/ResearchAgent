# Hyperparameters and tunables for the research assistant.
# Tweak these to change system behaviour. Secrets (API keys) stay in .env.
#
# Two-way synced with the Admin page (http://localhost:3000/admin): edits here are
# picked up live (no restart), and saves from the Admin page are written back here.
# Fields marked "requires restart" on the Admin page need `docker compose restart backend`.
# An env var SECTION__KEY (e.g. LLM__MODEL=gpt-4.1) overrides the value in this file.

[llm]
provider = "openai"
model = "gpt-6-luna"
temperature = 0.2          # higher = more varied queries/analysis
max_tokens = 2000
timeout_s = 60
max_retries = 2            # API-level retries on transient errors

[embeddings]
provider = "openai"
model = "text-embedding-3-small"
dimension = 1536           # must match the model; changing it needs a new/empty collection
batch_size = 64

[planner]
num_queries = 4            # focused search queries generated per question

[research]
max_results_per_query = 5
max_papers_per_run = 12
sort_by = "relevance"      # relevance | lastUpdatedDate | submittedDate
request_delay_s = 3.0      # arXiv asks for ~1 request / 3 s

[ingest]
max_pdfs_per_run = 8
max_pdf_mb = 20
download_timeout_s = 30
chunk_size = 1000
chunk_overlap = 150

[retrieval]
top_k = 8                  # passages retrieved per query
metric = "COSINE"          # COSINE | IP | L2
score_threshold = 0.0      # drop passages scoring below this

[evidence]
max_retries = 2            # research loops before forcing the report (cycle cap)
min_supported_ratio = 0.7  # share of claims that must be supported to pass

[report]
max_citations = 15

[storage]
sqlite_filename = "app.db"
milvus_filename = "milvus.db"
milvus_collection = "paper_passages"
