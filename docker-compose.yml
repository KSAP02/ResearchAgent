services:
  backend:
    build:
      context: .                      # root, so the shared requirements.txt is visible
      dockerfile: backend/Dockerfile  # uses backend/Dockerfile.dockerignore
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
      CONFIG_PATH: /app/config/config.toml
    volumes:
      - research_data:/data     # Milvus Lite (milvus.db) + SQLite (app.db)
      # Directory mount (not a single file), read-write: the Admin page writes
      # config.toml and editor saves on the host stay visible without a restart.
      - ./config:/app/config
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  research_data:
