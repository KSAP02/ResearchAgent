<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4E4B46"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6F8572"/>
    </marker>
  </defs>
  <rect width="960" height="620" rx="14" fill="#F5F4F1"/>
  <text x="30" y="40" font-size="20" font-weight="600" fill="#2A2A28">What happens when you press Run</text>
  <text x="30" y="62" font-size="13" fill="#6E6A63">Numbered steps match the list in learning_notes.md. Green = written by the TraceRecorder callback.</text>

  <!-- lane heads -->
  <g font-size="13" font-weight="600" fill="#2A2A28" text-anchor="middle">
    <rect x="40" y="82" width="120" height="40" rx="8" fill="#ECEBE7" stroke="#D4D0C9"/><text x="100" y="107">Browser (React)</text>
    <rect x="210" y="82" width="120" height="40" rx="8" fill="#ECEBE7" stroke="#D4D0C9"/><text x="270" y="107">nginx</text>
    <rect x="380" y="82" width="140" height="40" rx="8" fill="#ECEBE7" stroke="#D4D0C9"/><text x="450" y="107">FastAPI</text>
    <rect x="580" y="82" width="150" height="40" rx="8" fill="#DDE3DC" stroke="#6F8572"/><text x="655" y="107">LangGraph graph</text>
    <rect x="790" y="82" width="140" height="40" rx="8" fill="#ECEBE7" stroke="#D4D0C9"/><text x="860" y="107">SQLite app.db</text>
  </g>
  <g stroke="#D4D0C9" stroke-width="1.5" stroke-dasharray="4 4">
    <line x1="100" y1="122" x2="100" y2="600"/><line x1="270" y1="122" x2="270" y2="600"/>
    <line x1="450" y1="122" x2="450" y2="600"/><line x1="655" y1="122" x2="655" y2="600"/>
    <line x1="860" y1="122" x2="860" y2="600"/>
  </g>

  <g font-size="12" fill="#2A2A28">
    <!-- 1 -->
    <line x1="100" y1="160" x2="266" y2="160" stroke="#4E4B46" stroke-width="1.6" marker-end="url(#a)"/>
    <text x="110" y="153">① POST /api/research</text>
    <!-- 2 -->
    <line x1="270" y1="195" x2="446" y2="195" stroke="#4E4B46" stroke-width="1.6" marker-end="url(#a)"/>
    <text x="280" y="188">② proxy /api/*</text>
    <!-- 3 -->
    <line x1="450" y1="230" x2="856" y2="230" stroke="#4E4B46" stroke-width="1.6" marker-end="url(#a)"/>
    <text x="460" y="223">③ create run row: status=running + config snapshot</text>
    <!-- 4 -->
    <line x1="450" y1="265" x2="651" y2="265" stroke="#4E4B46" stroke-width="1.6" marker-end="url(#a)"/>
    <text x="460" y="258">④ invoke + callbacks</text>
    <!-- 5 self -->
    <rect x="610" y="282" width="90" height="96" rx="6" fill="#DDE3DC" stroke="#6F8572"/>
    <text x="655" y="302" text-anchor="middle" font-size="11">⑤ planner</text>
    <text x="655" y="318" text-anchor="middle" font-size="11">researcher</text>
    <text x="655" y="334" text-anchor="middle" font-size="11">…</text>
    <text x="655" y="350" text-anchor="middle" font-size="11">evidence loop</text>
    <text x="655" y="366" text-anchor="middle" font-size="11">report</text>
    <!-- 6 -->
    <line x1="700" y1="330" x2="856" y2="330" stroke="#6F8572" stroke-width="1.8" marker-end="url(#g)"/>
    <text x="708" y="322" fill="#4E5F51">⑥ trace spans</text>
    <text x="708" y="348" font-size="11" fill="#6E6A63">insert on start,</text>
    <text x="708" y="362" font-size="11" fill="#6E6A63">update on end</text>
    <!-- 7 -->
    <line x1="655" y1="410" x2="454" y2="410" stroke="#4E4B46" stroke-width="1.6" marker-end="url(#a)"/>
    <text x="470" y="403">⑦ final state</text>
    <!-- 8 -->
    <line x1="450" y1="445" x2="856" y2="445" stroke="#4E4B46" stroke-width="1.6" marker-end="url(#a)"/>
    <text x="460" y="438">⑧ finish run: completed, duration, tokens, cost</text>
    <!-- 9 -->
    <line x1="450" y1="480" x2="104" y2="480" stroke="#4E4B46" stroke-width="1.6" marker-end="url(#a)"/>
    <text x="118" y="473">⑨ JSON: run_id, queries, rationale, report, tokens</text>
    <!-- 10 -->
    <line x1="100" y1="530" x2="446" y2="530" stroke="#4E4B46" stroke-width="1.6" marker-end="url(#a)"/>
    <text x="110" y="523">⑩ "View trace" → GET /api/runs/{id}/trace</text>
    <!-- 11 -->
    <line x1="450" y1="565" x2="856" y2="565" stroke="#4E4B46" stroke-width="1.6" marker-end="url(#a)"/>
    <text x="460" y="558">⑪ SELECT spans → tree on the Runs page</text>
  </g>
</svg>
